<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body style="margin: 0; padding: 0; background-color: #F3F1E9; font-family: 'Inter', Arial, sans-serif; color: #1A1A1A;">
    <table width="100%" cellpadding="0" cellspacing="0" style="background-color: #F3F1E9; padding: 40px 20px;">
        <tr>
            <td align="center">
                <table width="100%" max-width="600" cellpadding="0" cellspacing="0" style="max-width: 600px; background-color: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 8px 24px rgba(0, 49, 83, 0.08);">
                    
                    <!-- Header -->
                    <tr>
                        <td style="background-color: #003153; padding: 30px 40px; text-align: center; border-bottom: 4px solid #FFC512;">
                            <h1 style="margin: 0; color: #FFC512; font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 600; letter-spacing: 1px;">
                                PokéGogh
                            </h1>
                            <p style="margin: 5px 0 0 0; color: #F3F1E9; font-size: 14px; font-style: italic; opacity: 0.8;">
                                The Art of Pokémon
                            </p>
                        </td>
                    </tr>

                    <!-- Body Content -->
                    <tr>
                        <td style="padding: 40px; line-height: 1.6; font-size: 16px; color: #1A1A1A;">
                            {{bodyContent}}
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td style="background-color: #0b151c; padding: 30px 40px; text-align: center; border-top: 1px solid #1a242b;">
                            <p style="margin: 0; color: #A0B0C0; font-size: 13px; font-family: 'Inter', sans-serif;">
                                &copy; {{year}} PokéGogh Museum Collection | Inspired by Vincent van Gogh
                            </p>
                            <p style="margin: 12px 0 0 0; color: #888888; font-size: 12px; font-family: 'Inter', sans-serif;">
                                This is an automated message. Please do not reply directly to this email.
                            </p>
                        </td>
                    </tr>

                </table>
            </td>
        </tr>
    </table>
</body>
</html>
